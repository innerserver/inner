<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inner Google Helper</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>Inner Google Helper</h1>
      <label>
        Inner app URL
        <input id="innerUrl" placeholder="https://inner-yourapp.onrender.com" />
      </label>
      <button id="saveUrl" type="button">Save URL</button>
      <div class="grid">
        <button data-open="docs" type="button">Docs</button>
        <button data-open="slides" type="button">Slides</button>
        <button data-open="sheets" type="button">Sheets</button>
        <button data-create="docs" type="button">New Doc</button>
        <button data-create="slides" type="button">New Slides</button>
        <button data-create="sheets" type="button">New Sheet</button>
      </div>
      <button id="shareCurrent" class="wide" type="button">Share current tab in Inner</button>
      <p id="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>

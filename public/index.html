<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Inner</title>
    <meta name="theme-color" content="#f7f7f4" />
    <meta name="application-name" content="Inner" />
    <meta name="apple-mobile-web-app-title" content="Inner" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/styles.css?v=inner-10" />
  </head>
  <body>
    <div id="loginView" class="login-shell">
      <form id="loginForm" class="login-panel">
        <div class="brand-row">
          <span class="brand-mark">in</span>
          <div>
            <h1>Inner</h1>
            <p>Private workspace login</p>
          </div>
        </div>
        <label>
          Username
          <input id="loginUsername" name="username" autocomplete="username" required />
        </label>
        <label>
          Password
          <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
        </label>
        <button class="primary-button" type="submit">Sign in</button>
        <p id="loginError" class="form-error" role="alert"></p>
      </form>
    </div>

    <div id="appView" class="app hidden">
      <aside class="sidebar">
        <div class="brand-row app-brand">
          <span class="brand-mark">in</span>
          <div>
            <h1 id="roomName">Inner</h1>
            <span id="serverPill" class="status-pill">Checking</span>
          </div>
        </div>

        <nav class="nav-list" aria-label="Main">
          <button class="nav-button active" type="button" data-view="messages">Messages</button>
          <button class="nav-button" type="button" data-view="dms">DMs</button>
          <button class="nav-button" type="button" data-view="store">Store</button>
          <button class="nav-button" type="button" data-view="files">Files</button>
          <button class="nav-button" type="button" data-view="screen">Screen</button>
          <button id="adminNavButton" class="nav-button owner-only hidden" type="button" data-view="admin">Admin</button>
        </nav>

        <div class="sidebar-footer">
          <div>
            <span class="muted-label">Signed in</span>
            <strong id="currentUser">-</strong>
          </div>
          <button id="logoutButton" class="ghost-button" type="button">Log out</button>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div>
            <span class="muted-label">Connection</span>
            <strong id="connectionStatus">Offline</strong>
          </div>
          <div class="topbar-metrics">
            <span><b id="messageCount">0</b> messages</span>
            <span><b id="fileCount">0</b> files</span>
            <span><b id="peerCount">0</b> online</span>
          </div>
          <div class="topbar-actions">
            <button id="notificationsButton" class="ghost-light-button" type="button">Enable alerts</button>
            <button id="installButton" class="ghost-light-button" type="button">Install app</button>
          </div>
        </header>

        <section id="messagesView" class="view active">
          <div class="section-header">
            <div>
              <h2>Messages</h2>
              <p id="messageState">Live room</p>
            </div>
            <label class="compact-label">
              Room
              <select id="roomSelect"></select>
            </label>
          </div>
          <div id="messageList" class="message-list" aria-live="polite"></div>
          <form id="messageForm" class="composer">
            <input id="messageInput" maxlength="2000" placeholder="Write a message" autocomplete="off" />
            <input id="messageAttachment" type="file" accept="image/*,video/*" />
            <button id="sendMessageButton" class="primary-button" type="submit">Send</button>
          </form>
        </section>

        <section id="dmsView" class="view">
          <div class="section-header">
            <div>
              <h2>DMs</h2>
              <p id="dmState">Direct messages</p>
            </div>
            <label class="compact-label">
              Account
              <select id="dmPeerSelect"></select>
            </label>
          </div>
        </section>
      </main>
    </div>

    <div id="toast" class="toast hidden" role="status"></div>
    <script src="/app.js?v=inner-10" defer></script>
  </body>
</html>
